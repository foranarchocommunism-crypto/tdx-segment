<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title"><title id="title">选择对应版本，解压文件</title><metadata></metadata><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="960" height="310" rx="18" fill="#101722"/><circle cx="51" cy="48" r="21" fill="#82dec5"/><text x="44" y="55" fill="#101722" font-size="20" font-weight="700">1</text><text x="90" y="55" fill="#f4f7fb" font-size="26" font-weight="600">选择对应版本，解压文件</text><text x="36" y="97" fill="#9aaabd" font-size="17" font-weight="400">先看通达信的位数，再选择下载包。</text><rect x="36" y="125" width="414" height="118" rx="12" fill="#1b293b"/><text x="58" y="165" fill="#f4f7fb" font-size="22" font-weight="400">32 位通达信  →  x86 包</text><text x="58" y="208" fill="#f4f7fb" font-size="22" font-weight="400">64 位通达信  →  x64 包</text><text x="498" y="158" fill="#9aaabd" font-size="18" font-weight="400">解压后保留：</text><text x="498" y="197" fill="#82dec5" font-size="20" font-weight="400">TDXSegment.dll  +  examples/tdx</text><text x="498" y="232" fill="#9aaabd" font-size="17" font-weight="400">公式和说明在同一个下载包中。</text><text x="36" y="286" fill="#74869b" font-size="13" font-weight="400">操作示意图 · 按钮名称和位置以所用通达信版本为准</text></g></svg>
