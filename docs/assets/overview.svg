<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="268" viewBox="0 0 1120 268" role="img" aria-labelledby="title description">
  <title id="title">缠论线段自动划分：计算与接入流程</title>
  <desc id="description">笔端点与高低价输入，经线段计算内核生成结构端点和确认事件，再由通达信公式绘图。内核支持可选审计与回归核查。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1118" height="266" rx="22" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="30" y="40" fill="#475569" font-size="18" font-weight="600" letter-spacing="2">计算与接入流程</text>
    <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 258 126 H 296"/>
      <path d="M 538 126 H 576"/>
      <path d="M 818 126 H 856"/>
    </g>
    <rect x="24" y="68" width="234" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="304" y="68" width="234" height="116" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="584" y="68" width="234" height="116" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="864" y="68" width="232" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g fill="#0f172a" font-size="28" font-weight="700" text-anchor="middle">
      <text x="141" y="119">笔端点输入</text>
      <text x="421" y="119">线段计算内核</text>
      <text x="701" y="119">线段事件输出</text>
      <text x="980" y="119">通达信绘图</text>
    </g>
    <g fill="#475569" font-size="19" text-anchor="middle">
      <text x="141" y="153">端点标记 · 高价 H · 低价 L</text>
      <text x="421" y="153">向上 / 向下 · 策略与确认</text>
      <text x="701" y="153">结构端点 · 确认时点</text>
      <text x="980" y="153">接入公式 · 自检与显示</text>
    </g>
    <path d="M 421 184 V 214 H 455" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="455" y="199" width="331" height="32" rx="16" fill="#e2e8f0"/>
    <text x="621" y="221" fill="#334155" font-size="18" text-anchor="middle">可选：审计记录与回归核查</text>
  </g>
</svg>
