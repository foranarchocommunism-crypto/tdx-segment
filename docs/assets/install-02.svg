<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title"><title id="title">绑定到第 1 号 DLL</title><metadata></metadata><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="960" height="310" rx="18" fill="#101722"/><circle cx="51" cy="48" r="21" fill="#82dec5"/><text x="44" y="55" fill="#101722" font-size="20" font-weight="700">2</text><text x="90" y="55" fill="#f4f7fb" font-size="26" font-weight="600">绑定到第 1 号 DLL</text><text x="36" y="97" fill="#9aaabd" font-size="17" font-weight="400">退出通达信后放好文件，再打开公式管理器的 DLL 绑定入口。</text><rect x="36" y="124" width="888" height="125" rx="12" fill="#1b293b"/><text x="58" y="165" fill="#82dec5" font-size="22" font-weight="400">第 1 号</text><text x="214" y="165" fill="#f4f7fb" font-size="22" font-weight="400">选择文件：TDXSegment.dll</text><text x="58" y="208" fill="#f4f7fb" font-size="20" font-weight="400">绑定后保存</text><text x="214" y="208" fill="#9aaabd" font-size="18" font-weight="400">随包公式默认使用第 1 号，保持一致即可。</text><text x="36" y="286" fill="#74869b" font-size="13" font-weight="400">操作示意图 · 按钮名称和位置以所用通达信版本为准</text></g></svg>
