<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title"><title id="title">新建指标，先自检再看主图</title><metadata></metadata><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect width="960" height="310" rx="18" fill="#101722"/><circle cx="51" cy="48" r="21" fill="#82dec5"/><text x="44" y="55" fill="#101722" font-size="20" font-weight="700">3</text><text x="90" y="55" fill="#f4f7fb" font-size="26" font-weight="600">新建指标，先自检再看主图</text><text x="36" y="97" fill="#9aaabd" font-size="17" font-weight="400">打开公式文本，复制内容到新建的技术指标中，测试通过后保存。</text><rect x="36" y="124" width="888" height="125" rx="12" fill="#1b293b"/><text x="58" y="165" fill="#82dec5" font-size="22" font-weight="400">先用 01 自检</text><text x="300" y="165" fill="#ffd36b" font-size="22" font-weight="400">通过后用 03 看主图</text><text x="58" y="208" fill="#f4f7fb" font-size="20" font-weight="400">03：线段 + 笔 + 待定区 K 线</text><text x="540" y="208" fill="#9aaabd" font-size="17" font-weight="400">02：保留原主图并叠加笔和线段</text><text x="36" y="286" fill="#74869b" font-size="13" font-weight="400">操作示意图 · 按钮名称和位置以所用通达信版本为准</text></g></svg>
