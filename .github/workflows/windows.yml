name: Windows build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Test
        shell: powershell
        run: ./scripts/test.ps1 -Architecture ${{ matrix.architecture }}
      - name: Check public tree and formulas
        shell: powershell
        run: |
          python -B scripts/check_public_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check_formula_identifiers.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ctest-${{ matrix.architecture }}
          path: build/${{ matrix.architecture }}/ctest-results.xml
          if-no-files-found: warn
